<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập Quản Trị - Daily PC Cleaner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200/80 p-8">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-teal-50 border border-teal-200 mb-4 shadow-sm">
        <span class="text-3xl">🛡️</span>
      </div>
      <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Daily PC Cleaner PRO</h1>
      <p class="text-sm text-slate-500 mt-1">Hệ Thống Quản Trị Bản Quyền Đám Mây</p>
    </div>

    <div id="errorAlert" class="hidden mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm flex items-center gap-2">
      <span>⚠️</span>
      <span id="errorMessage">Tài khoản hoặc mật khẩu không chính xác!</span>
    </div>

    <form id="loginForm" class="space-y-5" onsubmit="handleLogin(event)">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Tài khoản quản trị</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">👤</span>
          <input type="text" id="username" required value="admin"
            class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 outline-none text-slate-800 text-sm transition"
            placeholder="Nhập tên đăng nhập">
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Mật khẩu</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">🔒</span>
          <input type="password" id="password" required value="admin123"
            class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 outline-none text-slate-800 text-sm transition"
            placeholder="Nhập mật khẩu">
        </div>
      </div>

      <button type="submit" id="submitBtn"
        class="w-full py-3 px-4 rounded-xl bg-teal-700 hover:bg-teal-800 text-white font-semibold text-sm shadow-sm hover:shadow transition flex items-center justify-center gap-2 cursor-pointer">
        <span>Đăng Nhập Quản Trị</span>
        <span>→</span>
      </button>
    </form>

    <div class="mt-8 pt-6 border-t border-slate-100 text-center">
      <p class="text-xs text-slate-400">Serverless License API on Netlify • 2026</p>
    </div>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const btn = document.getElementById('submitBtn');
      const errorAlert = document.getElementById('errorAlert');

      btn.disabled = true;
      btn.innerHTML = '<span>Đang xác thực...</span>';
      errorAlert.classList.add('hidden');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: user, password: pass })
        });
        const data = await res.json();
        if (data.success && data.token) {
          localStorage.setItem('admin_token', data.token);
          window.location.href = '/index.html';
        } else {
          document.getElementById('errorMessage').innerText = data.error || 'Đăng nhập không thành công!';
          errorAlert.classList.remove('hidden');
        }
      } catch (err) {
        document.getElementById('errorMessage').innerText = 'Không thể kết nối đến máy chủ API: ' + err.message;
        errorAlert.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Đăng Nhập Quản Trị</span><span>→</span>';
      }
    }
  </script>
</body>
</html>
